name: "Code Coverage"

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  coverage:
    name: Generate JaCoCo Coverage Report
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Run tests and generate coverage
        working-directory: openmrs-module-appointmentscheduling
        run: mvn -pl api clean test

      - name: Upload JaCoCo HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ github.sha }}
          path: openmrs-module-appointmentscheduling/api/target/site/jacoco
          retention-days: 90

      - name: Upload JaCoCo XML Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-xml-${{ github.sha }}
          path: openmrs-module-appointmentscheduling/api/target/site/jacoco/jacoco.xml
          retention-days: 90